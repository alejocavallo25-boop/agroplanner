<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modo campo · AgroPlanner</title>
<meta name="theme-color" content="#195c2e">
<link rel="manifest" href="manifest.json">

<!--
  Esta pantalla existe para un solo momento: estar parado en el lote, sin señal,
  y necesitar anotar lo que se acaba de hacer antes de olvidarlo.

  Por eso NO depende de nada de afuera. Sin conexión no cargan ni la tipografía de
  Google ni los íconos del CDN, así que los estilos van acá adentro y los íconos
  son dibujos SVG escritos a mano. Un ícono que no carga deja un cuadradito; una
  hoja de estilos que no carga deja la pantalla inservible justo cuando es la
  única que hay.

  Es un archivo estático a propósito: el service worker lo guarda tal cual, y como
  no trae ningún dato del productor adentro, guardarlo no expone nada. Los lotes,
  los insumos y la campaña viven aparte, en la base del teléfono.
-->

<style>
:root {
    /* Los mismos colores de la aplicación, escritos acá porque style.css puede no
       estar disponible y esta pantalla tiene que verse igual igual. */
    --bg:        oklch(0.968 0.006 150);
    --card:      oklch(1 0 0);
    --hundido:   oklch(0.985 0.004 150);
    --tinta:     oklch(0.240 0.012 150);
    --apagado:   oklch(0.460 0.012 150);   /* 4,9:1 sobre el fondo */
    --borde:     oklch(0.895 0.008 150);
    --borde-duro:oklch(0.820 0.009 150);
    --verde:     oklch(0.420 0.100 150);
    --verde-osc: oklch(0.340 0.090 150);
    --verde-sua: oklch(0.520 0.100 150 / 0.10);
    --rojo:      oklch(0.450 0.160 28);
    --rojo-sua:  oklch(0.450 0.160 28 / 0.10);
    --ambar:     oklch(0.470 0.120 70);
    --ambar-sua: oklch(0.470 0.120 70 / 0.12);
    --foco:      oklch(0.420 0.100 150 / 0.45);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--tinta);
    /* Public Sans si el sistema la tiene; si no, la del teléfono. Nunca una
       descarga, que sin señal no llega. */
    font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;                 /* 16 y no menos: abajo de eso iOS hace zoom al tocar un campo */
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
}

.envoltura { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }

/* ── Encabezado ───────────────────────────────────────────────────────────── */
header {
    position: sticky; top: 0; z-index: 10;
    background: var(--verde-osc); color: #fff;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    margin: 0 -16px 16px;
}
.barra { display: flex; align-items: center; gap: 10px; max-width: 560px; margin: 0 auto; }
.marca { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.05rem; }
.marca svg { flex: 0 0 22px; }
.volver {
    margin-left: auto; color: #fff; text-decoration: none;
    font-size: 0.85rem; font-weight: 600; opacity: 0.9;
    padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3);
}

/* ── El estado de la conexión ─────────────────────────────────────────────── */
.estado {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: 12px; margin-bottom: 16px;
    font-size: 0.9rem; font-weight: 600;
    border: 1px solid var(--borde);
}
.estado .punto { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; }
.estado small { display: block; font-weight: 400; font-size: 0.82rem; opacity: 0.85; }
.estado.sin-senal  { background: var(--ambar-sua); border-color: var(--ambar); color: var(--ambar); }
.estado.sin-senal .punto  { background: var(--ambar); }
.estado.con-senal  { background: var(--verde-sua); border-color: var(--verde); color: var(--verde); }
.estado.con-senal .punto  { background: var(--verde); }
.estado.mandando   { background: var(--verde-sua); border-color: var(--verde); color: var(--verde); }
.estado.mandando .punto   { background: var(--verde); animation: latir 1.2s infinite; }
@keyframes latir { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .estado .punto { animation: none; } }

/* ── Formulario ───────────────────────────────────────────────────────────── */
.tarjeta {
    background: var(--card); border: 1px solid var(--borde);
    border-radius: 14px; padding: 18px; margin-bottom: 16px;
}
.tarjeta h2 { margin: 0 0 14px; font-size: 1rem; font-weight: 700; }

label { display: block; font-size: 0.84rem; font-weight: 600; color: var(--apagado); margin-bottom: 6px; }
.campo { margin-bottom: 16px; }

input[type=text], input[type=number], input[type=date], select {
    width: 100%; padding: 12px 14px; font-size: 1rem; font-family: inherit;
    color: var(--tinta); background: var(--card);
    border: 1px solid var(--borde-duro); border-radius: 10px;
}
input:focus, select:focus, button:focus-visible {
    outline: 3px solid var(--foco); outline-offset: 1px; border-color: var(--verde);
}

/* Los lotes como botones y no como una lista desplegable: en el campo se toca con
   el dedo, con guantes, y muchas veces el gasto va a más de un lote. */
.lotes { display: flex; flex-wrap: wrap; gap: 8px; }
.lote {
    padding: 10px 14px; border-radius: 10px; font-size: 0.92rem; font-weight: 600;
    border: 1px solid var(--borde-duro); background: var(--card); color: var(--tinta);
    cursor: pointer; min-height: 44px;          /* el mínimo para tocar cómodo */
}
.lote[aria-pressed=true] { background: var(--verde); color: #fff; border-color: var(--verde); }
.lote small { display: block; font-weight: 400; opacity: 0.75; font-size: 0.75rem; }

.segmentado { display: flex; gap: 0; border: 1px solid var(--borde-duro); border-radius: 10px; overflow: hidden; }
.segmentado button {
    flex: 1; padding: 12px 8px; font-size: 0.92rem; font-weight: 600; font-family: inherit;
    border: 0; background: var(--card); color: var(--apagado); cursor: pointer; min-height: 46px;
}
.segmentado button + button { border-left: 1px solid var(--borde-duro); }
.segmentado button[aria-pressed=true] { background: var(--verde); color: #fff; }

.fila { display: flex; gap: 10px; }
.fila > * { flex: 1; }

.guardar {
    width: 100%; padding: 16px; font-size: 1.05rem; font-weight: 700; font-family: inherit;
    background: var(--verde); color: #fff; border: 0; border-radius: 12px; cursor: pointer;
    min-height: 54px;
}
.guardar:disabled { opacity: 0.5; cursor: default; }

.aviso {
    padding: 12px 14px; border-radius: 10px; font-size: 0.88rem;
    background: var(--rojo-sua); color: var(--rojo); border: 1px solid var(--rojo);
    margin-bottom: 14px;
}
.aviso:empty { display: none; }

/* ── La cola ──────────────────────────────────────────────────────────────── */
.pendiente {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 0; border-top: 1px solid var(--borde);
}
.pendiente:first-of-type { border-top: 0; }
.pendiente .que { flex: 1; font-size: 0.9rem; }
.pendiente .que strong { display: block; }
.pendiente .que span { color: var(--apagado); font-size: 0.82rem; }
.pendiente .plata { font-weight: 700; white-space: nowrap; }
.pendiente .borrar {
    background: none; border: 0; color: var(--apagado); cursor: pointer;
    font-size: 1.2rem; line-height: 1; padding: 4px 8px; min-height: 32px;
}
.error-envio { color: var(--rojo); font-size: 0.8rem; display: block; }
.vacio { color: var(--apagado); font-size: 0.9rem; margin: 0; }
</style>
</head>
<body>

<header>
    <div class="barra">
        <span class="marca">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
                <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
            </svg>
            Modo campo
        </span>
        <a class="volver" href="index.php">Al panel</a>
    </div>
</header>

<div class="envoltura">

    <div class="estado" id="estado" role="status" aria-live="polite">
        <span class="punto"></span>
        <span id="estado-txt">Viendo si hay señal…</span>
    </div>

    <div class="aviso" id="aviso" role="alert"></div>

    <form class="tarjeta" id="form" novalidate>
        <h2>Anotar un gasto</h2>

        <div class="campo">
            <label id="lbl-lotes">¿En qué lote?</label>
            <div class="lotes" id="lotes" role="group" aria-labelledby="lbl-lotes"></div>
        </div>

        <div class="campo">
            <label id="lbl-etapa">¿En qué gastaste?</label>
            <div class="lotes" id="grupos" role="group" aria-labelledby="lbl-etapa"></div>
        </div>

        <div class="campo">
            <label id="lbl-tipo">¿Qué fue?</label>
            <div class="segmentado" role="group" aria-labelledby="lbl-tipo">
                <button type="button" id="es-labor"  aria-pressed="true">Una labor</button>
                <button type="button" id="es-insumo" aria-pressed="false">Un insumo</button>
            </div>
        </div>

        <div class="campo" id="caja-insumo" hidden>
            <label for="insumo">¿Qué insumo?</label>
            <select id="insumo"></select>
            <div id="caja-insumo-libre" hidden style="margin-top:10px;">
                <label for="insumo-libre">Nombre del insumo</label>
                <input type="text" id="insumo-libre" maxlength="150" placeholder="Como lo llamás vos">
            </div>
            <div style="margin-top:10px;">
                <label for="cantidad">¿Cuánto usaste en total? <span id="unidad"></span></label>
                <input type="number" id="cantidad" inputmode="decimal" step="any" min="0">
            </div>
        </div>

        <div class="campo">
            <label for="monto">¿Cuánto costó en total?</label>
            <div class="fila">
                <input type="number" id="monto" inputmode="decimal" step="any" min="0" placeholder="0">
                <select id="moneda" style="flex:0 0 110px;">
                    <option value="ARS">$ pesos</option>
                    <option value="USD">US$ dólares</option>
                </select>
            </div>
        </div>

        <div class="campo">
            <label for="fecha">¿Qué día?</label>
            <input type="date" id="fecha">
        </div>

        <button type="submit" class="guardar" id="guardar">Guardar</button>
    </form>

    <div class="tarjeta">
        <h2>Sin mandar todavía <span id="cuenta"></span></h2>
        <div id="cola"><p class="vacio">No hay nada esperando. Todo lo que cargaste ya está en el servidor.</p></div>
    </div>

</div>

<script>
/* Esta pantalla también registra el service worker, y no sólo las páginas .php.
   Es la que uno deja guardada en la pantalla de inicio del teléfono, así que
   puede ser la primera —y la única— que se abra. Si dependiera de haber pasado
   antes por el panel, alguien la agregaría al inicio y descubriría recién en el
   campo, sin señal, que no anda. */
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw-campo.js', { updateViaCache: 'none' })
        .catch(function () { /* sin service worker la pantalla sigue andando con señal */ });
}
</script>
<script src="assets/js/campo.js"></script>
</body>
</html>
